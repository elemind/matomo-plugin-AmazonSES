name: Plugin AmazonSES Tests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-unit:
    name: Unit tests (standalone, PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          tools: composer:v2
      - name: Install test dependencies
        run: |
          mkdir -p /tmp/deps && cd /tmp/deps
          composer require -q --no-interaction "phpunit/phpunit:^9.6" "phpmailer/phpmailer:^7.0"
      - name: Run unit tests
        run: AMAZONSES_VENDOR_AUTOLOAD=/tmp/deps/vendor/autoload.php /tmp/deps/vendor/bin/phpunit -c tests/phpunit.standalone.xml

  plugin-tests:
    name: Matomo ${{ matrix.target }} (PHP ${{ matrix.php }}, ${{ matrix.db-engine }} ${{ matrix.db-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 'matomo6_min_php'
            target: minimum_required_matomo
            db-engine: Mysql
            db-version: '8.0'
          - php: 'matomo6_max_php'
            target: maximum_supported_matomo
            db-engine: Mysql
            db-version: '8.0'
          - php: 'matomo6_min_php'
            target: minimum_required_matomo
            db-engine: Mariadb
            db-version: '10.6'
          - php: 'matomo6_max_php'
            target: maximum_supported_matomo
            db-engine: Mariadb
            db-version: '10.6'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: matomo-org/github-action-tests@main
        with:
          plugin-name: 'AmazonSES'
          php-version: ${{ matrix.php }}
          test-type: 'PluginTests'
          matomo-test-branch: ${{ matrix.target }}
          mysql-engine: ${{ matrix.db-engine }}
          mysql-version: ${{ matrix.db-version }}
